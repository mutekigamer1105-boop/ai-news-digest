<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 智讯日报 · 每日行业情报杂志</title>
<style>
  :root{
    --bg:#f6f3ec; --paper:#fffdf8; --ink:#20242b; --ink-2:#4a5560; --ink-3:#8a939e;
    --line:#e3ddd1; --line-soft:#ede8dd; --accent:#a63a2b; --accent-deep:#7f2a1e;
    --teal:#2a7f7f; --gold:#b8860b;
    --serif: Georgia,"Noto Serif SC","Songti SC","SimSun",serif;
    --sans:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.7;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  a:hover{color:var(--accent)}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px}
  .serif{font-family:var(--serif)}

  /* top */
  header{position:sticky;top:0;z-index:40;background:rgba(246,243,236,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .bar{display:flex;align-items:center;gap:16px;height:58px}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:700;font-size:19px;letter-spacing:.5px}
  .brand .seal{width:30px;height:30px;border-radius:7px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;font-family:var(--sans)}
  .tabs{margin-left:auto;display:flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px}
  .tab{padding:8px 18px;border-radius:999px;font-size:13px;font-weight:650;color:var(--ink-2);cursor:pointer;border:none;background:transparent}
  .tab.active{background:var(--accent);color:#fff}
  .meta{font-size:12px;color:var(--ink-3);margin-left:6px;white-space:nowrap}

  .layout{display:grid;grid-template-columns:254px 1fr;gap:22px;padding:22px 0 60px}
  @media(max-width:880px){.layout{grid-template-columns:1fr}}

  /* sidebar */
  .side{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px;align-self:start;position:sticky;top:76px}
  .side h3{font-family:var(--serif);font-size:15px;margin:0 0 4px;font-weight:700}
  .side .sub{font-size:12px;color:var(--ink-3);margin-bottom:12px}
  .daylist{list-style:none;margin:0;padding:0;max-height:66vh;overflow:auto}
  .daylist li{padding:10px 11px;border-radius:9px;cursor:pointer;font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:8px;transition:.12s;border:1px solid transparent}
  .daylist li:hover{background:#f3efe6}
  .daylist li.active{background:var(--accent);color:#fff;font-weight:650}
  .daylist li.active .cnt{background:rgba(255,255,255,.22);color:#fff}
  .daylist .cnt{margin-left:auto;font-size:11px;color:var(--ink-3);background:#efe9dc;padding:2px 8px;border-radius:999px}
  .side .note{margin-top:14px;font-size:12px;color:var(--ink-3);line-height:1.6;border-top:1px dashed var(--line);padding-top:12px}
  .side .note b{color:var(--ink-2)}

  .panel{min-width:0}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px}

  /* magazine toolbar */
  .magbar{display:flex;align-items:center;gap:12px;margin-bottom:14px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:8px 14px}
  .navbtn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer;color:var(--ink-2);font-weight:600}
  .navbtn:hover{border-color:var(--accent);color:var(--accent)}
  .magbar .date{font-family:var(--serif);font-size:16px;font-weight:700;margin:0 auto}
  .magbar .go{font-size:12px;color:var(--ink-3)}

  /* cover */
  .cover{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:26px;margin-bottom:18px}
  .masthead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-size:12px;letter-spacing:2px;color:var(--accent);text-transform:uppercase;font-weight:700}
  .masthead .right{color:var(--ink-3);letter-spacing:1px;text-align:right;font-weight:600}
  .cover h1{font-family:var(--serif);font-size:clamp(26px,4vw,40px);line-height:1.18;margin:16px 0 6px;font-weight:800}
  .oneliner{border-left:4px solid var(--accent);background:linear-gradient(90deg,rgba(166,58,43,.06),transparent);padding:13px 16px;border-radius:8px;margin:18px 0 6px;font-size:15px;color:var(--ink-2)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
  .chip{font-size:12.5px;font-weight:650;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 13px;color:var(--ink-2)}
  .chip b{color:var(--accent)}
  .trendrow{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:16px 0}
  @media(max-width:720px){.trendrow{grid-template-columns:1fr}}
  .trend{border:1px solid var(--line);border-radius:14px;padding:16px;background:#fff}
  .trend .no{font-size:11px;letter-spacing:2px;color:var(--accent);font-weight:700}
  .trend .t{font-family:var(--serif);font-size:17px;font-weight:700;margin:8px 0 2px}
  .trend .c{font-size:12px;color:var(--ink-3)}
  .trend-art{border-radius:10px;overflow:hidden;margin-bottom:11px;height:78px}
  .trend-art svg{display:block;width:100%;height:100%}
  .focusrow{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:16px 0}
  @media(max-width:720px){.focusrow{grid-template-columns:1fr}}
  .focus{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;cursor:pointer;transition:.16s}
  .focus:hover{box-shadow:0 10px 26px rgba(120,60,40,.14);border-color:var(--accent);transform:translateY(-2px)}
  .focus .fa{height:96px;overflow:hidden}
  .focus .fa svg{display:block;width:100%;height:100%}
  .focus .fb{padding:13px 15px}
  .focus .no{font-size:11px;letter-spacing:2px;color:var(--teal);font-weight:700}
  .focus .t{font-family:var(--serif);font-size:17px;font-weight:800;margin:7px 0 2px}
  .focus .c{font-size:12px;color:var(--ink-3)}
  .heroart{margin:16px 0 2px;border-radius:14px;overflow:hidden}
  .heroart svg{display:block;width:100%;height:118px}
  .modtitle{display:flex;align-items:center;gap:9px;font-family:var(--serif);font-size:16px;font-weight:800;margin:20px 0 10px}
  .modtitle::before{content:"";width:5px;height:18px;background:var(--accent);border-radius:3px}
  .sig{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--line-soft)}
  .sig:last-child{border-bottom:none}
  .sig .n{font-family:var(--serif);font-size:22px;line-height:1;color:var(--teal);flex:none;margin-top:2px}
  .sig .st{font-size:14.5px;font-weight:650}
  .sig .ss{font-size:13px;color:var(--ink-2);margin-top:3px}
  .sig a.st:hover{color:var(--accent)}
  .toc{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:6px}
  .tocsec{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff;cursor:pointer;transition:.12s}
  .tocsec:hover{border-color:var(--accent);box-shadow:0 6px 16px rgba(120,60,40,.08)}
  .tocsec .no{font-size:11px;letter-spacing:2px;color:var(--teal);font-weight:700}
  .tocsec .t{font-family:var(--serif);font-size:16px;font-weight:750;margin:6px 0 2px}
  .tocsec .c{font-size:12px;color:var(--ink-3)}

  /* sections */
  .sec{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:16px;scroll-margin-top:80px}
  .sechead{display:flex;align-items:baseline;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:14px}
  .sechead .no{font-family:var(--serif);font-size:30px;color:var(--accent);line-height:1}
  .sechead .nm{font-family:var(--serif);font-size:21px;font-weight:800}
  .sechead .cn{font-size:11px;letter-spacing:1px;color:var(--ink-3);text-transform:uppercase;margin-left:auto}
  .item{display:grid;grid-template-columns:16px 1fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--line-soft)}
  .item:last-child{border-bottom:none}
  .item .bullet{color:var(--accent);font-size:20px;line-height:1.2;padding-top:1px}
  .item .it{font-size:16px;font-weight:700;font-family:var(--serif)}
  .item .is{font-size:13.5px;color:var(--ink-2);margin-top:4px}
  .item .im{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center}
  .tag{font-size:11px;background:#eee7d9;border:1px solid var(--line);color:var(--ink-2);padding:2px 9px;border-radius:999px}
  .src{font-size:11.5px;color:var(--teal);font-weight:600}
  .bld{font-size:11px;color:var(--accent);font-weight:650}
  .imp{font-size:11px;color:var(--gold);font-weight:700}
  .note{background:#f3efe6;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13.5px;color:var(--ink-2);margin-top:10px}

  /* range view */
  .rangebar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font-size:11px;color:var(--ink-3);font-weight:650;letter-spacing:.4px}
  .field input{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:13.5px}
  .preset{display:flex;gap:6px;flex-wrap:wrap}
  .preset button{background:#fff;border:1px solid var(--line);color:var(--ink-2);border-radius:999px;padding:8px 14px;font-size:12.5px;font-weight:600;cursor:pointer}
  .preset button:hover{border-color:var(--accent)}
  .go{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:11px 22px;font-size:14px;font-weight:750;cursor:pointer}
  .go:disabled{opacity:.5;cursor:not-allowed}
  .statcards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}
  @media(max-width:700px){.statcards{grid-template-columns:repeat(2,1fr)}}
  .st{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px;text-align:center}
  .st .v{font-size:26px;font-weight:850;color:var(--accent)}
  .st .l{font-size:12px;color:var(--ink-2);margin-top:5px}
  .bars{margin-top:8px}
  .bar{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12.5px}
  .bar .name{width:110px;color:var(--ink-2);flex:none}
  .bar .track{flex:1;background:#efe9dc;border-radius:999px;height:12px;overflow:hidden}
  .bar .fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--teal),var(--accent))}
  .bar .num{width:34px;text-align:right;color:var(--ink);font-weight:700}
  footer{border-top:1px solid var(--line);padding:26px 0 44px;text-align:center;color:var(--ink-3);font-size:12.5px}
  footer .title{font-family:var(--serif);font-weight:750;color:var(--ink-2);font-size:15px}
  .ai-note{font-size:11.5px;color:var(--ink-3);margin-top:10px}
  .ai-note b{color:var(--accent)}
  .spinner{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:-3px;margin-right:6px}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <div class="brand"><span class="seal">智</span> AI 智讯日报 <span style="font-size:12px;color:var(--ink-3);font-weight:500;letter-spacing:1px">DAILY AI INTELLIGENCE</span></div>
    <div class="tabs">
      <button class="tab active" data-mode="mag">每日杂志</button>
      <button class="tab" data-mode="range">日期范围总结</button>
    </div>
    <span class="meta" id="metaMini"></span>
  </div>
</header>

<main class="wrap">
  <div class="layout">
    <aside class="side">
      <h3>近 30 日刊</h3>
      <div class="sub">点击任一日期，翻阅当日行业情报杂志</div>
      <ul class="daylist" id="dayList"></ul>
      <div class="note">本刊由 AI 智讯日报 · 情报自动化引擎生成，<b>每日中午 12:00 自动更新</b>。所有条目附原始链接，可回溯来源。</div>
    </aside>

    <section class="panel">
      <!-- MAGAZINE -->
      <div id="magView">
        <div class="magbar">
          <button class="navbtn" id="prevDay">‹ 前一日</button>
          <div class="date" id="magDate"></div>
          <button class="navbtn" id="nextDay">后一日 ›</button>
        </div>
        <div id="magazine"></div>
      </div>

      <!-- RANGE -->
      <div id="rangeView" style="display:none">
        <div class="card">
          <div class="modtitle" style="margin-top:0">圈选日期，一键总结</div>
          <div style="font-size:13px;color:var(--ink-3)">自由选择起止日期范围，对所选范围内的 AI 情报做统一总结。</div>
          <div class="rangebar">
            <div class="field"><label>开始日期</label><input type="date" id="startDate" /></div>
            <div class="field"><label>结束日期</label><input type="date" id="endDate" /></div>
            <div class="preset">
              <button data-days="3">近 3 天</button><button data-days="7">近 7 天</button>
              <button data-days="14">近 14 天</button><button data-days="30">近 30 天</button>
            </div>
            <button class="go" id="goBtn">生成 AI 总结</button>
          </div>
        </div>
        <div id="rangeResult"></div>
      </div>
    </section>
  </div>

  <footer>
    <div class="title">AI 智讯日报 · 行业情报杂志</div>
    <div>每日 12:00 自动更新 · 30+ 信源 × 25 位行业 Builder · 5 道质量审核门</div>
  </footer>
</main>

<script>
  // 由构建脚本注入（单文件、可离线、可任意静态托管）
  const DATA = /*__DATA__*/;
  const SUMMARIZE_ENDPOINT = window.DIGEST_SUMMARIZE_ENDPOINT || '/api/summarize';

  const $ = s => document.querySelector(s);
  const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const days = (DATA.days||[]).slice().sort((a,b)=>b.date.localeCompare(a.date)); // 最新在前
  let cur = 0;

  // 主题抽象视觉(内联 SVG,零外部依赖,离线可用):按标签哈希生成主题色与装饰
  function art(label, h){
    const seed = String(label||'x').split('').reduce((a,c)=>a+c.charCodeAt(0),0);
    const hue = 8 + (seed % 24);              // 暖调杂志红/棕区间
    const hue2 = (hue + 180) % 360;
    const id = 'ga'+seed;
    let deco = '';
    const c1 = 28 + (seed % 14), c2 = 62 + (seed % 12);
    deco += `<circle cx="${c1+18}" cy="${c2-12}" r="${26+seed%12}" fill="rgba(255,255,255,0.10)"/>`;
    deco += `<circle cx="${c2+22}" cy="${c1+26}" r="${14+seed%9}" fill="rgba(255,255,255,0.16)"/>`;
    deco += `<path d="M ${c1} ${c2+10} q ${40+seed%30} -${30+seed%20} ${90} 0" stroke="rgba(255,255,255,0.35)" stroke-width="2.4" fill="none"/>`;
    deco += `<line x1="${c1}" y1="${c2+8}" x2="${c2+40}" y2="${c1+14}" stroke="rgba(255,255,255,0.4)" stroke-width="1.6"/>`;
    deco += `<rect x="${c2+18}" y="${c1+8}" width="18" height="18" fill="rgba(255,255,255,0.12)"/>`;
    return `<svg viewBox="0 0 200 120" preserveAspectRatio="xMidYMid slice" style="height:${h||96}px;width:100%;background:hsl(${hue},52%,32%);border-radius:0">
      <defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="hsl(${hue},55%,40%)"/><stop offset="1" stop-color="hsl(${hue2},60%,30%)"/>
      </linearGradient></defs>
      <rect width="200" height="120" fill="url(#${id})"/>${deco}</svg>`;
  }

  function init(){
    const st = DATA.meta||{};
    $('#metaMini').textContent = (st.days||days.length)+' 期 · '+(st.total_items||0)+' 条情报';
    const ul = $('#dayList');
    ul.innerHTML = days.map((d,i)=>`<li data-i="${i}" class="${i===0?'active':''}">
        <span>${esc(d.date_cn||d.date)}</span><span class="cnt">${d.total_signals??d.items.length}</span></li>`).join('');
    ul.querySelectorAll('li').forEach(li=>li.onclick=()=>select(Number(li.dataset.i)));
    // 范围默认
    const start = days[days.length-1]||{date:''}, end = days[0]||{date:''};
    $('#startDate').value=start.date; $('#endDate').value=end.date;
    document.querySelectorAll('.preset button').forEach(b=>b.onclick=()=>{
      const n=+b.dataset.days; let s=new Date(end.date); s.setDate(s.getDate()-n+1);
      $('#startDate').value=s.toISOString().slice(0,10); $('#endDate').value=end.date;
    });
    $('#goBtn').onclick=buildRange;
    $('#prevDay').onclick=()=>select(Math.min(cur+1,days.length-1));
    $('#nextDay').onclick=()=>select(Math.max(cur-1,0));
    document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
      document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active')); t.classList.add('active');
      $('#magView').style.display=t.dataset.mode==='mag'?'':'none';
      $('#rangeView').style.display=t.dataset.mode==='range'?'':'none';
    });
    select(0);
  }

  function select(i){
    i = Math.max(0, Math.min(i, days.length-1)); cur=i;
    document.querySelectorAll('.daylist li').forEach(li=>li.classList.toggle('active', +li.dataset.i===i));
    renderMagazine(days[i]);
  }

  // ---------- 杂志渲染 ----------
  function renderMagazine(d){
    const dcn = esc(d.date_cn||d.date);
    $("#magDate").textContent = dcn;
    let h = `<div class="cover">
      <div class="masthead"><div>AI 智讯日报 · 每日行业情报杂志</div><div class="right">第 ${d.date} 期</div></div>
      <h1 class="serif">${esc(d.headline||'')}</h1>
      <div class="oneliner">${esc(d.one_line_read||'')}</div>
      <div class="chips">
        <span class="chip"><b>${(d.trends||[]).length}</b> 大趋势</span>
        <span class="chip"><b>${d.total_signals??d.items.length}</b> 条核心信号</span>
        <span class="chip">覆盖 ${(d.sections||[]).length} 个栏目</span>
      </div>
      <div class="heroart">${art(d.headline||'AI智能', 118)}</div>`;

    if((d.trends||[]).length){
      h += `<div class="modtitle">趋势</div><div class="trendrow">` + d.trends.map((t,i)=>`
        <div class="trend"><div class="trend-art">${art(t.label,78)}</div>
          <div class="no">0${i+1} / 趋势</div><div class="t">${esc(t.label)}</div>
          <div class="c">${t.count} 条相关情报</div></div>`).join('') + `</div>`;
    }

    if((d.core_signals||[]).length){
      h += `<div class="modtitle">核心信号</div>` + d.core_signals.map((s,i)=>sig(s,i)).join('');
    }

    // 三栏焦点卡片(点击栏目标题跳转详情)
    const focus = (d.sections||[]).slice(0,3);
    if(focus.length){
      h += `<div class="modtitle">本期焦点</div><div class="focusrow">` + focus.map(s=>`
        <div class="focus" onclick="gotoSec('${d.sections.indexOf(s)}')">
          <div class="fa">${art(s.name,96)}</div>
          <div class="fb"><div class="no">0${d.sections.indexOf(s)+1} / 栏目</div>
            <div class="t">${esc(s.name)}</div><div class="c">${s.items.length} 篇报道</div></div></div>`).join('') + `</div>`;
    }
    h += `</div>`;

    (d.sections||[]).forEach((s,i)=>{
      h += `<div class="sec" id="sec-${i}">
        <div class="sechead"><div class="no">0${i+1}</div><div class="nm">${esc(s.name)}</div><div class="cn">SECTION</div></div>` +
        s.items.map(it=>item(it)).join('') + `</div>`;
    });

    if((d.builder_dynamics||[]).length){
      h += `<div class="sec" id="sec-builders"><div class="sechead"><div class="no">✦</div><div class="nm">人物动态</div><div class="cn">PEOPLE</div></div>` +
        d.builder_dynamics.map(b=>item(b)).join('') + `</div>`;
    }
    if((d.trend_notes||[]).length){
      h += `<div class="sec" id="sec-notes"><div class="sechead"><div class="no">※</div><div class="nm">趋势注记</div><div class="cn">NOTES</div></div>` +
        d.trend_notes.map(n=>`<div class="note">${esc(n)}</div>`).join('') + `</div>`;
    }
    $("#magazine").innerHTML = h;
    window.scrollTo({top:0,behavior:'smooth'});
  }

  function sig(s,i){
    return `<div class="sig"><div class="n">${String(i+1).padStart(2,'0')}</div><div>
      <a class="st" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>
      <div class="ss">${esc(s.summary)}</div>
      <div class="im">${s.source?`<span class="src">${esc(s.source)}</span>`:''}${s.builder?`<span class="bld">👤 ${esc(s.builder)}</span>`:''}${s.importance!=null?`<span class="imp">★ ${Number(s.importance).toFixed(2)}</span>`:''}</div>
    </div></div>`;
  }

  function item(it){
    return `<div class="item"><div class="bullet">▪</div><div>
      <a class="it" href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>
      <div class="is">${esc(it.summary)}</div>
      <div class="im">${it.source?`<span class="src">${esc(it.source)}</span>`:''}${it.builder?`<span class="bld">👤 ${esc(it.builder)}</span>`:''}${(it.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
    </div></div>`;
  }

  function gotoSec(i){
    const el = document.getElementById('sec-'+i);
    if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
  }

  // ---------- 范围总结 ----------
  function buildRange(){
    const s=$('#startDate').value, e=$('#endDate').value;
    if(!s||!e||s>e){ alert('请选择正确的起止日期'); return; }
    const btn=$('#goBtn'); btn.disabled=true; btn.textContent='生成中…';
    const inR=d=>d.date>=s&&d.date<=e;
    const sel=days.filter(inR).sort((a,b)=>a.date.localeCompare(b.date));
    let items=[]; sel.forEach(d=>items=items.concat((d.items||[]).map(i=>({...i,date:d.date}))));
    items.sort((a,b)=>(b.importance||0)-(a.importance||0));
    const top=items.slice(0,18);
    const highlights=items.slice(0,5).map(i=>`[${i.date}] ${i.source} · ${i.title}`);
    const bins={}; items.forEach(i=>{bins[i.category]=(bins[i.category]||0)+1;});
    const cat=Object.entries(bins).sort((a,b)=>b[1]-a[1]); const maxC=Math.max(1,...cat.map(e=>e[1]));
    const bld={}; items.forEach(i=>{if(i.builder)bld[i.builder]=(bld[i.builder]||0)+1;});
    const bldTop=Object.entries(bld).sort((a,b)=>b[1]-a[1]).slice(0,6);
    const tags={}; items.forEach(i=>(i.tags||[]).forEach(t=>tags[t]=(tags[t]||0)+1));
    const tagTop=Object.entries(tags).sort((a,b)=>b[1]-a[1]).slice(0,6);

    let html=`<div class="card"><div class="modtitle" style="margin-top:0">选中概览</div>
      <div class="statcards">
        <div class="st"><div class="v">${sel.length}</div><div class="l">覆盖天数</div></div>
        <div class="st"><div class="v">${items.length}</div><div class="l">情报条数</div></div>
        <div class="st"><div class="v">${cat.length}</div><div class="l">主题分类</div></div>
        <div class="st"><div class="v">${items.reduce((s,i)=>s+(Number(i.importance)||0),0).toFixed(1)}</div><div class="l">累计重要度</div></div>
      </div></div>`;
    html+=`<div class="card"><div class="modtitle" style="margin-top:0">AI 统一总结</div><div id="aiSum"></div></div>`;
    html+=`<div class="card"><div class="modtitle" style="margin-top:0">亮点速览</div>`+
      highlights.map(x=>`<div class="note">${esc(x)}</div>`).join('')+`</div>`;
    html+=`<div class="card"><div class="modtitle" style="margin-top:0">主题分布</div><div class="bars">`+
      cat.map(([k,v])=>`<div class="bar"><span class="name">${esc(k)}</span><span class="track"><span class="fill" style="width:${(v/maxC*100).toFixed(0)}%"></span></span><span class="num">${v}</span></div>`).join('')+`</div></div>`;
    if(bldTop.length) html+=`<div class="card"><div class="modtitle" style="margin-top:0">活跃人物</div><div class="chips">`+
      bldTop.map(([k,v])=>`<span class="chip">${esc(k)} × ${v}</span>`).join('')+`</div></div>`;
    if(tagTop.length) html+=`<div class="card"><div class="modtitle" style="margin-top:0">热词标签</div><div class="chips">`+
      tagTop.map(([k,v])=>`<span class="chip">${esc(k)} · ${v}</span>`).join('')+`</div></div>`;
    html+=`<div class="card"><div class="modtitle" style="margin-top:0">重点条目</div>`+
      top.map(i=>item(i)).join('')+`</div>`;
    $('#rangeResult').innerHTML=html;
    aiSummary(s,e,items,sel.length).then(t=>{
      const box=$('#aiSum');
      box.innerHTML = t? `<div class="note" style="white-space:pre-wrap">${esc(t)}</div><div class="ai-note">本段由大模型接口生成。</div>`
        : deterministicSummary(sel,items)+`<div class="ai-note">当前未配置大模型接口（DIGEST_SUMMARIZE_ENDPOINT），已用确定性聚合输出。</div>`;
    }).finally(()=>{btn.disabled=false;btn.textContent='生成 AI 总结';});
  }
  function deterministicSummary(sel,items){
    if(!items.length) return `<div class="note">该范围内暂无通过审核的情报。</div>`;
    const top=items[0]; const cats={}; items.forEach(i=>cats[i.category]=(cats[i.category]||0)+1);
    const cs=Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k,v])=>`${k}(${v})`).join('、');
    const bb=items.filter(i=>i.builder).length;
    return `<div class="note" style="white-space:pre-wrap">在 ${sel.length} 天共 ${items.length} 条通过 5 道质量审核门的情报里，行业重心集中在：${cs}。其中重要度最高的为「${top.title}」（${top.source}，${top.date}）。涉及人物动态 ${bb} 条。总体看，模型与开源仍是热议主线，算力供应链与 Agent 应用是重要第二曲线，融资与治理保持稳定关注。可结合原文链接进一步核实。</div>`;
  }
  async function aiSummary(s,e,items,dn){
    if(!SUMMARIZE_ENDPOINT) return '';
    try{ const r=await fetch(SUMMARIZE_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({start:s,end:e,days:dn,items:items.slice(0,20).map(i=>({date:i.date,title:i.title,source:i.source,category:i.category}))})});
      if(!r.ok) return ''; const j=await r.json(); return j.summary||j.text||'';
    }catch(err){ return ''; }
  }
  init();
</script>
</body>
</html>
